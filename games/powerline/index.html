<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Powerline.io</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #g { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #bar {
    position: fixed; top: 12px; right: 12px; z-index: 100;
    display: flex; align-items: center; gap: 8px;
    font-family: sans-serif;
  }
  #bar a {
    background: var(--accent, greenyellow); color: #111;
    text-decoration: none; font-size: 13px; font-weight: 700;
    padding: 8px 14px; border-radius: 100px;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  #bar a:hover { filter: brightness(1.08); }
  #note {
    position: fixed; bottom: 12px; left: 12px; z-index: 100;
    background: rgba(0,0,0,.55); color: #fff; font-family: sans-serif;
    font-size: 12px; padding: 6px 10px; border-radius: 8px;
  }
</style>
</head>
<body>
<iframe id="g" src="https://powerline.io/" allow="fullscreen; autoplay; clipboard-write" referrerpolicy="no-referrer" allowfullscreen></iframe>
<div id="bar"><a id="open" href="https://powerline.io/" target="_blank" rel="noopener">Open in new tab</a></div>
<div id="note">Multiplayer — live arena. Doesn't load? Use "Open in new tab".</div>
<script>
  try {
    const saved = JSON.parse(localStorage.getItem("accent") || "{}");
    if (saved.accent) document.documentElement.style.setProperty("--accent", saved.accent);
  } catch (e) {}
</script>
</body>
</html>
